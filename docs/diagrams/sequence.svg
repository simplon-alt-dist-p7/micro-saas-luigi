<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2580" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de séquence de la décision sur un livrable</title>
  <desc id="desc">Parcours complet entre le client invité, le frontend Next.js, l’API Fastify et PostgreSQL, avec les cas d’accès interdit, de version obsolète, de motif absent et de décision acceptée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .participant { fill: #ccfbf1; stroke: #0f766e; stroke-width: 3; rx: 12; }
      .participant-text { font: 700 22px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 9; }
      .message { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .label { font: 18px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 16px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .section-label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .note { fill: #fef3c7; stroke: #92400e; stroke-width: 2; rx: 10; }
      .note-text { font: 17px Arial, sans-serif; fill: #78350f; }
      .success { fill: #dcfce7; stroke: #166534; stroke-width: 2; rx: 10; }
      .error { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
      .obsolete { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <rect width="1800" height="2580" fill="#ffffff"/>
  <text x="900" y="55" class="title" text-anchor="middle">Cockpit — Décision sur un livrable</text>

  <rect x="60" y="90" width="260" height="78" class="participant"/>
  <text x="190" y="137" class="participant-text">Client invité</text>
  <rect x="440" y="90" width="300" height="78" class="participant"/>
  <text x="590" y="124" class="participant-text">Frontend</text>
  <text x="590" y="150" class="small">Next.js</text>
  <rect x="850" y="90" width="300" height="78" class="participant"/>
  <text x="1000" y="124" class="participant-text">API</text>
  <text x="1000" y="150" class="small">Fastify</text>
  <rect x="1350" y="90" width="300" height="78" class="participant"/>
  <text x="1500" y="124" class="participant-text">Base de données</text>
  <text x="1500" y="150" class="small">PostgreSQL</text>

  <line x1="190" y1="168" x2="190" y2="2550" class="lifeline"/>
  <line x1="590" y1="168" x2="590" y2="2550" class="lifeline"/>
  <line x1="1000" y1="168" x2="1000" y2="2550" class="lifeline"/>
  <line x1="1500" y1="168" x2="1500" y2="2550" class="lifeline"/>

  <line x1="190" y1="235" x2="590" y2="235" class="message"/>
  <text x="390" y="220" class="label">1. Ouvrir la mission autorisée</text>
  <line x1="590" y1="315" x2="1000" y2="315" class="message"/>
  <text x="795" y="300" class="label">2. GET /api/missions/{id}/portal</text>
  <line x1="1000" y1="395" x2="1500" y2="395" class="message"/>
  <text x="1250" y="365" class="label">3. BEGIN et SET LOCAL organization_id</text>
  <text x="1250" y="386" class="small">Résolution du tenant depuis la session</text>
  <line x1="1000" y1="475" x2="1500" y2="475" class="message"/>
  <text x="1250" y="460" class="label">4. Lire mission, accès et livrables visibles</text>
  <line x1="1500" y1="555" x2="1000" y2="555" class="return"/>
  <text x="1250" y="540" class="label">5. Vue client filtrée</text>
  <line x1="1000" y1="635" x2="1500" y2="635" class="message"/>
  <text x="1250" y="620" class="label">6. COMMIT</text>
  <line x1="1000" y1="715" x2="590" y2="715" class="return"/>
  <text x="795" y="700" class="label">7. 200 — mission et livrables</text>
  <line x1="590" y1="795" x2="190" y2="795" class="return"/>
  <text x="390" y="780" class="label">8. Afficher progression et actions</text>

  <line x1="55" y1="850" x2="1745" y2="850" stroke="#cbd5e1" stroke-width="3"/>
  <text x="80" y="884" class="section-label">Décision du client</text>

  <line x1="190" y1="945" x2="590" y2="945" class="message"/>
  <text x="390" y="930" class="label">9. Valider ou demander une révision</text>
  <rect x="265" y="975" width="650" height="95" class="note"/>
  <text x="290" y="1010" class="note-text">La demande de révision exige un motif.</text>
  <text x="290" y="1042" class="note-text">La requête contient la version affichée.</text>
  <line x1="590" y1="1135" x2="1000" y2="1135" class="message"/>
  <text x="795" y="1108" class="label">10. POST /api/deliverables/{id}/decision</text>
  <text x="795" y="1130" class="small">{ decision, reason?, version }</text>
  <line x1="1000" y1="1215" x2="1500" y2="1215" class="message"/>
  <text x="1250" y="1200" class="label">11. BEGIN et contexte d’organisation</text>
  <line x1="1000" y1="1295" x2="1500" y2="1295" class="message"/>
  <text x="1250" y="1268" class="label">12. SELECT livrable et accès FOR UPDATE</text>
  <text x="1250" y="1290" class="small">Vérifier rôle, rattachement, statut et version</text>
  <line x1="1500" y1="1375" x2="1000" y2="1375" class="return"/>
  <text x="1250" y="1360" class="label">13. État courant ou aucun résultat</text>

  <rect x="420" y="1420" width="1260" height="230" class="error"/>
  <text x="445" y="1455" class="section-label">Alternative A — accès non autorisé</text>
  <line x1="1000" y1="1510" x2="1500" y2="1510" class="message"/>
  <text x="1250" y="1495" class="label">14. ROLLBACK</text>
  <line x1="1000" y1="1585" x2="590" y2="1585" class="return"/>
  <text x="795" y="1570" class="label">15. 404 — ressource introuvable</text>
  <text x="600" y="1625" class="small">Ne révèle pas l’existence d’une ressource tierce</text>

  <rect x="420" y="1680" width="1260" height="265" class="obsolete"/>
  <text x="445" y="1715" class="section-label">Alternative B — statut ou version obsolète</text>
  <line x1="1000" y1="1770" x2="1500" y2="1770" class="message"/>
  <text x="1250" y="1755" class="label">16. ROLLBACK</text>
  <line x1="1000" y1="1845" x2="590" y2="1845" class="return"/>
  <text x="795" y="1830" class="label">17. 409 — état devenu obsolète</text>
  <line x1="590" y1="1910" x2="1000" y2="1910" class="message"/>
  <text x="795" y="1895" class="label">18. Recharger l’état courant</text>

  <rect x="420" y="1975" width="1260" height="210" class="error"/>
  <text x="445" y="2010" class="section-label">Alternative C — demande de révision sans motif</text>
  <line x1="1000" y1="2065" x2="1500" y2="2065" class="message"/>
  <text x="1250" y="2050" class="label">19. ROLLBACK</text>
  <line x1="1000" y1="2140" x2="590" y2="2140" class="return"/>
  <text x="795" y="2125" class="label">20. 422 — motif obligatoire</text>

  <rect x="420" y="2215" width="1260" height="340" class="success"/>
  <text x="445" y="2250" class="section-label">Alternative D — décision autorisée</text>
  <line x1="1000" y1="2300" x2="1500" y2="2300" class="message"/>
  <text x="1250" y="2275" class="label">21. Insérer l’historique et mettre à jour le livrable</text>
  <text x="1250" y="2297" class="small">Statut, version, dates et progression dans une transaction</text>
  <line x1="1500" y1="2365" x2="1000" y2="2365" class="return"/>
  <text x="1250" y="2350" class="label">22. Livrable et progression actualisés</text>
  <line x1="1000" y1="2425" x2="1500" y2="2425" class="message"/>
  <text x="1250" y="2410" class="label">23. COMMIT</text>
  <line x1="1000" y1="2475" x2="590" y2="2475" class="return"/>
  <text x="795" y="2460" class="label">24. 200 puis événement WebSocket</text>
  <line x1="590" y1="2525" x2="190" y2="2525" class="return"/>
  <text x="390" y="2510" class="label">25. Confirmer la décision</text>
</svg>
